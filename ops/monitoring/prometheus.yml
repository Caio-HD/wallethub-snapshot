global:
  scrape_interval: 15s
  evaluation_interval: 1m
  scrape_timeout: 10s

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files:
  - /etc/prometheus/rules/alert-rules.yml

scrape_configs:
  - job_name: wallethub-api
    static_configs:
      - targets:
          - api:3000
    metrics_path: /metrics
    scheme: http

  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090
