name: wallethub_prod

services:
  postgres:
    image: pgvector/pgvector:pg15
    container_name: wallethub_postgres
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    environment:
      POSTGRES_DB: ${DB_NAME:-wallethub}
      POSTGRES_USER: ${DB_USER:-wallethub}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change_me}
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-wallethub}"]
      interval: 10s
      timeout: 5s
      retries: 12
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./backups/postgres:/var/backups
    networks:
      - internal

  redis:
    image: redis:7-alpine
    container_name: wallethub_redis
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    ports:
      - "56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
    volumes:
      - redis_data:/data
    networks:
      - internal

  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile.ci
      target: release
      args:
        NODE_VERSION: ${NODE_VERSION:-22}
    image: wallethub/api:latest
    container_name: wallethub_api
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env.deploy
    environment:
      # fallback para execução sem arquivo .env.deploy
      DATABASE_URL: ${DATABASE_URL:-postgres://wallethub:change_me@postgres:5432/wallethub}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      NODE_ENV: production
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/api/health >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 5
    volumes:
      - jwt_secrets:/app/secrets/jwt:ro
      - storage_data:/var/storage/wallethub
    networks:
      - internal
    labels:
      - traefik.enable=true
      - traefik.docker.network=wallethub_prod
      - traefik.http.routers.api-main.rule=(Host(`${WALLETHUB_PRIMARY_DOMAIN:wallethub.example.com}`) || Host(`${WALLETHUB_SECONDARY_DOMAIN:-wallethub.example.com}`)) && PathPrefix(`/api`)
      - traefik.http.routers.api-main.entrypoints=web,websecure
      - traefik.http.routers.api-main.tls.certresolver=letsencrypt
      - traefik.http.routers.api-main.service=api-main
      - traefik.http.routers.api-main.priority=100
      - traefik.http.routers.api-main.middlewares=secure-headers
      - traefik.http.routers.api-main-http.rule=(Host(`${WALLETHUB_PRIMARY_DOMAIN:wallethub.example.com}`) || Host(`${WALLETHUB_SECONDARY_DOMAIN:-wallethub.example.com}`)) && PathPrefix(`/api`)
      - traefik.http.routers.api-main-http.entrypoints=web
      - traefik.http.routers.api-main-http.service=api-main
      - traefik.http.routers.api-main-http.priority=105
      - traefik.http.routers.api-main-http.middlewares=secure-headers
      - traefik.http.services.api-main.loadbalancer.server.port=3000
      - traefik.http.services.api-main.loadbalancer.passhostheader=true
      - traefik.http.routers.api-webhook.rule=(Host(`${WALLETHUB_PRIMARY_DOMAIN:wallethub.example.com}`) || Host(`${WALLETHUB_SECONDARY_DOMAIN:-wallethub.example.com}`)) && PathPrefix(`/whatsapp`)
      - traefik.http.routers.api-webhook.entrypoints=web,websecure
      - traefik.http.routers.api-webhook.tls.certresolver=letsencrypt
      - traefik.http.routers.api-webhook.service=api-main
      - traefik.http.routers.api-webhook.middlewares=secure-headers
      - traefik.http.routers.api-webhook.priority=95
      - traefik.http.routers.api-metrics.rule=(Host(`${WALLETHUB_PRIMARY_DOMAIN:wallethub.example.com}`) || Host(`${WALLETHUB_SECONDARY_DOMAIN:-wallethub.example.com}`)) && PathPrefix(`/metrics`)
      - traefik.http.routers.api-metrics.entrypoints=web,websecure
      - traefik.http.routers.api-metrics.tls.certresolver=letsencrypt
      - traefik.http.routers.api-metrics.service=api-main
      - traefik.http.routers.api-metrics.middlewares=metrics-whitelist,secure-headers
      - traefik.http.routers.api-metrics.priority=90

  web:
    build:
      context: ../../apps/web
      dockerfile: Dockerfile.ci
      target: production
      args:
        NODE_VERSION: ${NODE_VERSION:-22}
        PLAYWRIGHT_VERSION: ${PLAYWRIGHT_VERSION:-1.48.2}
    image: wallethub/web:latest
    container_name: wallethub_web
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
    networks:
      - internal
    labels:
      - traefik.enable=true
      - traefik.docker.network=wallethub_prod
      - traefik.http.routers.web-app.rule=(Host(`${WALLETHUB_PRIMARY_DOMAIN:wallethub.example.com}`) || Host(`${WALLETHUB_SECONDARY_DOMAIN:-wallethub.example.com}`)) && !PathPrefix(`/api`) && !PathPrefix(`/whatsapp`) && !PathPrefix(`/metrics`)
      - traefik.http.routers.web-app.entrypoints=web,websecure
      - traefik.http.routers.web-app.tls.certresolver=letsencrypt
      - traefik.http.routers.web-app.service=web-app
      - traefik.http.routers.web-app.priority=10
      - traefik.http.routers.web-app.middlewares=secure-headers,web-spa
      - traefik.http.routers.web-app-http.rule=(Host(`${WALLETHUB_PRIMARY_DOMAIN:wallethub.example.com}`) || Host(`${WALLETHUB_SECONDARY_DOMAIN:-wallethub.example.com}`)) && !PathPrefix(`/api`) && !PathPrefix(`/whatsapp`) && !PathPrefix(`/metrics`)
      - traefik.http.routers.web-app-http.entrypoints=web
      - traefik.http.routers.web-app-http.service=web-app
      - traefik.http.routers.web-app-http.priority=5
      - traefik.http.routers.web-app-http.middlewares=secure-headers,web-spa
      - traefik.http.services.web-app.loadbalancer.server.port=80
      - traefik.http.routers.web-assets.rule=(Host(`${WALLETHUB_PRIMARY_DOMAIN:wallethub.example.com}`) || Host(`${WALLETHUB_SECONDARY_DOMAIN:-wallethub.example.com}`)) && PathRegexp(`/.+\\.(js|css|png|jpg|jpeg|gif|svg|ico|webp|woff2?)$`)
      - traefik.http.routers.web-assets.entrypoints=web,websecure
      - traefik.http.routers.web-assets.tls.certresolver=letsencrypt
      - traefik.http.routers.web-assets.priority=20
      - traefik.http.routers.web-assets.service=web-app
      - traefik.http.routers.web-assets.middlewares=secure-headers,static-assets-cache

  traefik:
    image: traefik:v3.1
    container_name: wallethub_traefik
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
      web:
        condition: service_started
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --api.insecure=true
      - --api.dashboard=true
      - --certificatesresolvers.letsencrypt.acme.email=${TRAEFIK_ACME_EMAIL:?Defina TRAEFIK_ACME_EMAIL no .env.deploy}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
      - --certificatesresolvers.letsencrypt.acme.keytype=RSA4096
      - --certificatesresolvers.letsencrypt.acme.caserver=${TRAEFIK_ACME_CA_SERVER:-https://acme-v02.api.letsencrypt.org/directory}
      - --log.level=DEBUG
      - --accesslog=true
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_letsencrypt:/letsencrypt
    networks:
      - internal
    labels:
      - traefik.enable=true
      - traefik.http.routers.http-catchall.rule=HostRegexp(`{host:.+}`)
      - traefik.http.routers.http-catchall.entrypoints=web
      - traefik.http.routers.http-catchall.middlewares=redirect-to-https
      - traefik.http.routers.http-catchall.priority=1
      - traefik.http.routers.http-catchall.service=noop@internal
      - traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https
      - traefik.http.middlewares.redirect-to-https.redirectscheme.permanent=true
      - traefik.http.middlewares.secure-headers.headers.stsSeconds=63072000
      - traefik.http.middlewares.secure-headers.headers.stsIncludeSubdomains=true
      - traefik.http.middlewares.secure-headers.headers.stsPreload=true
      - traefik.http.middlewares.secure-headers.headers.contentTypeNosniff=true
      - traefik.http.middlewares.secure-headers.headers.referrerPolicy=no-referrer-when-downgrade
      - traefik.http.middlewares.secure-headers.headers.frameDeny=true
      - traefik.http.middlewares.static-assets-cache.headers.customResponseHeaders.Cache-Control=public,max-age=2592000,immutable
      - traefik.http.middlewares.metrics-whitelist.ipwhitelist.sourcerange=127.0.0.1/32,10.0.0.0/8
      - traefik.http.middlewares.web-spa.errors.status=404
      - traefik.http.middlewares.web-spa.errors.service=web-app@docker
      - traefik.http.middlewares.web-spa.errors.query=/index.html

volumes:
  db_data:
  redis_data:
  storage_data:
  jwt_secrets:
  traefik_letsencrypt:

networks:
  internal:
    name: wallethub_prod
    driver: bridge
