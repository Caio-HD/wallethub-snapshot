[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --strict-markers
    --tb=short
    --cov=wallethub
    --cov-report=term-missing
    --cov-report=html
    --cov-report=xml
markers =
    unit: Testes unitários
    integration: Testes de integração
    e2e: Testes end-to-end

